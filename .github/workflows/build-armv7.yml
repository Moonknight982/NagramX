name: Build ARMv7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # check upstream every 6 hours

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > TMessagesProj/release.keystore

      - name: Patch ABI splits to armeabi-v7a only
        run: |
          python3 - << 'EOF'
          import re
          with open('TMessagesProj/build.gradle', 'r') as f:
              content = f.read()

          content = re.sub(
              r"include 'arm64-v8a',\s*'x86_64'",
              "include 'armeabi-v7a'",
              content
          )

          with open('TMessagesProj/build.gradle', 'w') as f:
              f.write(content)

          with open('TMessagesProj/build.gradle', 'r') as f:
              verify = f.read()
          if "include 'armeabi-v7a'" in verify:
              print("ABI patch successful")
          else:
              print("WARNING: ABI patch may have failed!")
          EOF

      - name: Patch update URL to point to fork
        run: |
          echo "=== Searching for NextAlone references ==="
          grep -r "NextAlone" TMessagesProj/src --include="*.java" --include="*.kt" \
            --include="*.json" --include="*.xml" --include="*.gradle" -rl || true

          echo "=== Searching for update/github URL patterns ==="
          grep -r "github" TMessagesProj/src -rl \
            --include="*.java" --include="*.kt" --include="*.json" --include="*.xml" || true

          echo "=== Searching in root-level gradle files ==="
          grep -r "NextAlone" . --include="*.gradle" --include="*.kts" -rl || true

          echo "=== Now patching all occurrences ==="
          find TMessagesProj/src . \( -name "*.java" -o -name "*.kt" \
            -o -name "*.json" -o -name "*.xml" -o -name "*.gradle" -o -name "*.kts" \) \
            -exec sed -i 's|NextAlone/NagramX|Moonknight982/NagramX|g' {} + 2>/dev/null || true

          find TMessagesProj/src . \( -name "*.java" -o -name "*.kt" \
            -o -name "*.json" -o -name "*.xml" -o -name "*.gradle" -o -name "*.kts" \) \
            -exec sed -i 's|NextAlone|Moonknight982|g' {} + 2>/dev/null || true

          echo "=== Verify ==="
          grep -r "Moonknight982" TMessagesProj/src --include="*.java" \
            --include="*.kt" --include="*.json" --include="*.xml" -rl || echo "Still not found — see search results above"
      
      - name: Inspect CloudStorageHelper update URL
        run: |
          grep -n "NextAlone\|NagramX\|Moonknight982\|github\|update\|release\|http" \
            TMessagesProj/src/main/java/tw/nekomimi/nekogram/helpers/CloudStorageHelper.java \
            | head -40
      
      - name: Bypass broken JetBrains Toolchain
        run: |
          find . -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) \
            -exec sed -i '/JvmVendorSpec\.JETBRAINS/d' {} +

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj:assembleRelease \
            -Dorg.gradle.jvmargs="-Xmx4g" \
            --stacktrace
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}

      - name: Find APK
        id: apk
        run: |
          APK=$(find . -name "*.apk" | grep -i "release" | grep -iv "unsigned" | head -1)
          echo "Found: $APK"
          echo "path=$APK" >> $GITHUB_OUTPUT

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' TMessagesProj/build.gradle | head -1)
          UPSTREAM_TAG="${{ needs.check.outputs.upstream_tag }}"

          # Fallback: if upstream_tag is empty (manual trigger), use version from gradle
          if [ -z "$UPSTREAM_TAG" ]; then
            TAG="v${VERSION}-armv7"
          else
            TAG="${UPSTREAM_TAG}-armv7"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Version: $VERSION | Tag: $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "NagramX ${{ steps.version.outputs.version }} (armeabi-v7a)"
          body: |
            ARMv7 build of NagramX ${{ steps.version.outputs.version }}
            Built from upstream tag: ${{ needs.check.outputs.upstream_tag }}
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
