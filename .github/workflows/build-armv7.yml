name: Build ARMv7

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > TMessagesProj/release.keystore

      - name: Patch ABI splits to armeabi-v7a only
        run: |
          python3 - << 'EOF'
          import re
          with open('TMessagesProj/build.gradle', 'r') as f:
              content = f.read()

          content = re.sub(
              r"include 'arm64-v8a',\s*'x86_64'",
              "include 'armeabi-v7a'",
              content
          )

          with open('TMessagesProj/build.gradle', 'w') as f:
              f.write(content)

          with open('TMessagesProj/build.gradle', 'r') as f:
              verify = f.read()
          if "include 'armeabi-v7a'" in verify:
              print("ABI patch successful")
          else:
              print("WARNING: ABI patch may have failed!")
          EOF

      - name: Disable upstream update checker
        run: |
          sed -i 's|NextAloneBot|DisabledBot|g' \
            TMessagesProj/src/main/java/tw/nekomimi/nekogram/helpers/CloudStorageHelper.java
          echo "Update checker disabled"

      - name: Bypass broken JetBrains Toolchain
        run: |
          find . -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) \
            -exec sed -i '/JvmVendorSpec\.JETBRAINS/d' {} +

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj:assembleRelease \
            -Dorg.gradle.jvmargs="-Xmx4g" \
            --stacktrace
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}

      - name: Find APK
        id: apk
        run: |
          APK=$(find . -name "*.apk" | grep -i "release" | grep -iv "unsigned" | head -1)
          echo "Found: $APK"
          echo "path=$APK" >> $GITHUB_OUTPUT

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' TMessagesProj/build.gradle | head -1)
          TAG="v${VERSION}-armv7"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Version: $VERSION | Tag: $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "NagramX ${{ steps.version.outputs.version }} (armeabi-v7a)"
          body: |
            ARMv7 build of NagramX ${{ steps.version.outputs.version }}
            Repo: https://github.com/anZxKr/NagramX
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
