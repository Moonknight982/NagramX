name: Build ARMv7

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > TMessagesProj/release.keystore

      - name: Patch ABI splits to armeabi-v7a only
        run: |
          python3 - << 'EOF'
          import re
          with open('TMessagesProj/build.gradle', 'r') as f:
              content = f.read()

          content = re.sub(
              r"include 'arm64-v8a',\s*'x86_64'",
              "include 'armeabi-v7a'",
              content
          )

          with open('TMessagesProj/build.gradle', 'w') as f:
              f.write(content)

          # Verify patch worked
          with open('TMessagesProj/build.gradle', 'r') as f:
              verify = f.read()
          if "include 'armeabi-v7a'" in verify:
              print("Patch successful")
          else:
              print("WARNING: Patch may have failed!")
          EOF

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj:assembleRelease \
            -Dorg.gradle.jvmargs="-Xmx4g" \
            --stacktrace
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}

      - name: Find APK
        id: apk
        run: |
          APK=$(find . -name "*.apk" | grep -i "release" | grep -iv "unsigned" | head -1)
          echo "Found: $APK"
          echo "path=$APK" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NagramX-armeabi-v7a
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7
