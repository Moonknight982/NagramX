name: Build ARMv7

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode local.properties
        run: echo "${{ secrets.LOCAL_PROPERTIES }}" | base64 -d > local.properties

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > TMessagesProj/release.keystore

      - name: Patch existing flavor to armeabi-v7a only
        run: |
          python3 - << 'EOF'
          with open('TMessagesProj/build.gradle', 'r') as f:
              content = f.read()

          import re

          # Replace all abiFilters lines to only keep armeabi-v7a
          content = re.sub(
              r'abiFilters\s+"armeabi-v7a",\s*"arm64-v8a"(?:,\s*"x86")?(?:,\s*"x86_64")?',
              'abiFilters "armeabi-v7a"',
              content
          )

          with open('TMessagesProj/build.gradle', 'w') as f:
              f.write(content)

          print("Patched all abiFilters to armeabi-v7a only")
          EOF

      - name: List assemble tasks
        run: |
          chmod +x gradlew
          ./gradlew tasks --all 2>/dev/null | grep -i assemble | grep -iv "test\|lint" || true

      - name: Build
        run: |
          ./gradlew assembleAfatRelease \
            -Dorg.gradle.jvmargs="-Xmx4g" \
            --stacktrace
      
      - name: Find APK
        id: apk
        run: |
          APK=$(find . -name "*.apk" | grep -i "armeabi_v7a" | grep -i "release" | head -1)
          echo "Found: $APK"
          echo "path=$APK" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NagramX-armeabi-v7a
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7
